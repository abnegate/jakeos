name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/roadmap
      - name: Build the validator
        working-directory: tools/roadmap
        run: cargo build --release
      - name: Regenerate
        run: tools/roadmap/target/release/roadmap gen --check
      - name: Assemble site
        run: |
          mkdir -p site
          cp generated/dashboard.html site/index.html
          cp generated/index.json site/index.json
          cp ROADMAP.md STATUS.md site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
