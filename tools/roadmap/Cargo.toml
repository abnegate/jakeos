[package]
name = "roadmap"
version = "0.1.0"
edition = "2024"
description = "Validator, formatter and roll-up generator for the JakeOS roadmap repository"
publish = false

[lib]
name = "roadmap"
path = "src/lib.rs"

[[bin]]
name = "roadmap"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

[workspace]
